<!-- html input 통해 n 입력 받기 -->
<!-- 1 ~ n까지의 누적합을 반복문 이용해 계산 -->
<!-- 누적합을 문서에 출력 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>누적합</title>
</head>
<body>
    <h2>누적합 구하기</h2>
    <input
        id = "input_number"
        type = "number"
        placeholder="정수를 입력하세요."
    />
    <button id = "btn" type = button>완료</button>
    <div id = "result"></div>
</body>
</html>
<script>
    
    document.getElementById("btn").onclick = function () {
       const num = document.getElementById("input_number").value;
       let result = 0;
       for (let i = 1; i <= num; i++) {
        result += i;
       }
       document.getElementById("result").textContent = result;
    };
</script>
